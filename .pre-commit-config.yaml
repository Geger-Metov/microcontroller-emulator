repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      # Конфиг один — ruff.toml в корне — и для gui/, и для Python-тестов в tests/python.
      - id: ruff-check
        args: [--fix]
        files: ^(gui|tests/python)/
      - id: ruff-format
        files: ^(gui|tests/python)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (gui)
        language: system
        entry: bash -c 'cd gui && uv run mypy src'
        pass_filenames: false
        files: ^gui/src/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++]
        files: ^(core|tests)/
