# A single ruff config for the whole repository (gui/ and tests/python/). It is found by
# the editor (Zed), pre-commit and CI alike — no separate --config is needed.

# Explicit: for ruff.toml (unlike pyproject.toml) the Python version is not inferred from
# requires-python, while the code uses 3.12+ syntax (generic functions).
target-version = "py312"

[lint.isort]
# `gui` lives in gui/src. Without an explicit setting the import sorting depends on
# where ruff is run from, and the editor and CI diverge.
known-first-party = ["gui"]
