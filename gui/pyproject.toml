[project]
name = "gui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Geger-Metov", email = "205748080+Geger-Metov@users.noreply.github.com" },
]
requires-python = ">=3.15"
dependencies = [
 "pyside6>=6.12.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pybind11>=3.1.0",
    "ruff>=0.17.5",
]

