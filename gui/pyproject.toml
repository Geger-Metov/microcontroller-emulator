[project]
name = "gui"
version = "0.1.0"
description = "GUI for the ATmega328P emulator (PySide6)"
readme = "README.md"
authors = [
    { name = "Geger-Metov", email = "205748080+Geger-Metov@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
 "pyside6>=6.12.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pybind11>=3.1.0",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.5",
]

[project.scripts]
gui = "gui.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["../tests/python"]
pythonpath = ["src"]

[tool.mypy]
mypy_path = "stubs"
python_version = "3.12"
